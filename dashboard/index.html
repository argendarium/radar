<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar de productos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%231C4ED8%27/%3E%3Crect x=%277%27 y=%2718%27 width=%274%27 height=%277%27 fill=%27white%27/%3E%3Crect x=%2714%27 y=%2712%27 width=%274%27 height=%2713%27 fill=%27white%27/%3E%3Crect x=%2721%27 y=%277%27 width=%274%27 height=%2718%27 fill=%27white%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F2F3F0; --panel: #FFFFFF; --ink: #17211C; --muted: #66716B; --line: #DDE1DC; --soft: #E8EBE7;
  --signal: #1C4ED8; --signal-soft: #E3EAFC; --trial: #9A5A08; --trial-soft: #F6ECDD;
  --win: #17703F; --win-soft: #E1F0E7; --drop: #7D8580; --drop-soft: #ECEEEC; --danger: #B42318;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --r-sm: 6px; --r-md: 10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #111513; --panel: #191E1B; --ink: #E7ECE9; --muted: #9AA59F; --line: #2A312D; --soft: #222825;
    --signal: #8AA7FF; --signal-soft: #1E2A4A; --trial: #E3A857; --trial-soft: #3A2C17;
    --win: #6FCB97; --win-soft: #16301F; --drop: #8E9792; --drop-soft: #242926; --danger: #F2877D;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.shell { max-width: 1320px; margin: 0 auto; padding: 28px 28px 60px; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.brand h1 { font: 700 34px/1 var(--display); letter-spacing: -0.02em; margin: 0; }
.brand p { margin: 8px 0 0; color: var(--muted); }
.actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r-sm); padding: 8px 14px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--signal); border-color: var(--signal); color: var(--panel); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .55; cursor: progress; }
.runline { color: var(--muted); font-size: 13px; margin-top: 14px; min-height: 20px; }
.runline .err { color: var(--danger); }
.notice { margin-top: 14px; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--panel); color: var(--muted); font-size: 14px; }

.filters { display: flex; gap: 10px; margin: 26px 0 14px; flex-wrap: wrap; align-items: center; }
.search { flex: 1 1 240px; min-width: 200px; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r-sm); padding: 8px 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--panel); padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 4px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--soft); color: var(--ink); font-weight: 600; }
select { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r-sm); padding: 8px 10px; }

.grid { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(360px, 1fr); gap: 20px; align-items: start; }
.list { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.head, .row { display: grid; grid-template-columns: 34px 48px minmax(0, 1fr) 70px 60px 132px; gap: 14px; align-items: center; padding: 0 18px; }
.head { height: 40px; color: var(--muted); font-size: 12.5px; border-bottom: 1px solid var(--line); }
.head .r { text-align: right; }
.row { min-height: 72px; border: 0; border-bottom: 1px solid var(--line); border-left: 3px solid transparent; cursor: pointer; width: 100%; background: none; text-align: left; padding-left: 15px; }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--paper); }
.row[aria-selected="true"] { background: var(--signal-soft); border-left-color: var(--signal); }
.rank { color: var(--muted); font-size: 13px; }
.thumb { width: 48px; height: 48px; border-radius: var(--r-sm); background: var(--soft); object-fit: cover; display: grid; place-items: center; font: 700 16px var(--display); color: var(--muted); overflow: hidden; }
.nameline { display: flex; align-items: center; gap: 8px; min-width: 0; }
.nameline .pill { flex: none; }
.name { display: block; min-width: 0; font: 500 16.5px/1.25 var(--display); letter-spacing: -0.005em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.name::first-letter { text-transform: uppercase; }
.sub { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.metric { text-align: right; font-size: 14px; }
.metric small { display: block; color: var(--muted); font-size: 12px; }
.scorecell { display: grid; grid-template-columns: 1fr; justify-items: end; gap: 6px; }
.score { font: 700 24px/1 var(--display); letter-spacing: -0.02em; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); }
.pill.en_prueba { background: var(--trial-soft); color: var(--trial); }
.pill.ganador { background: var(--win-soft); color: var(--win); }
.pill.descartado { background: var(--drop-soft); color: var(--drop); text-decoration: line-through; }
.pill.demo { background: transparent; border: 1px solid var(--line); font-weight: 500; }
.hint { color: var(--muted); font-size: 13.5px; }

/* Barra de señal: ancho de cada segmento = peso de la señal; relleno = puntaje */
.signal { display: flex; gap: 3px; width: 120px; height: 6px; }
.signal span { position: relative; background: var(--soft); border-radius: 2px; overflow: hidden; }
.signal span i { position: absolute; inset: 0 auto 0 0; background: var(--signal); border-radius: 2px; }
.signal.lg { width: 100%; height: 10px; gap: 4px; }

.detail { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow: auto; }
.dsec { padding: 20px 22px; border-bottom: 1px solid var(--line); }
.dsec:last-child { border-bottom: 0; }
.dtitle { font: 700 26px/1.1 var(--display); letter-spacing: -0.02em; margin: 0; }
.dtitle::first-letter { text-transform: uppercase; }
.dscore { display: flex; align-items: baseline; gap: 10px; margin: 16px 0 12px; }
.dscore b { font: 700 52px/1 var(--display); letter-spacing: -0.03em; color: var(--signal); }
.dscore span { color: var(--muted); }
.breakdown { display: grid; gap: 10px; margin-top: 16px; }
.brow { display: grid; grid-template-columns: 110px 1fr 36px; gap: 12px; align-items: center; font-size: 14px; }
.brow .bar { height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; }
.brow .bar i { display: block; height: 100%; background: var(--signal); }
.brow small { color: var(--muted); display: block; font-size: 12px; line-height: 1.2; }
.warn { color: var(--trial); font-size: 13.5px; margin-top: 12px; }
h3 { font: 600 14px/1.3 var(--body); margin: 0 0 12px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
label { display: grid; gap: 5px; font-size: 13px; color: var(--muted); }
input[type=number], textarea { border: 1px solid var(--line); background: var(--paper); border-radius: var(--r-sm); padding: 8px 10px; width: 100%; }
textarea { min-height: 70px; resize: vertical; }
.margin { margin: 12px 0 14px; font-size: 14px; }
.margin b { font-family: var(--display); font-size: 20px; }
.margin .good { color: var(--win); } .margin .bad { color: var(--danger); }
.savebar { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.saved { color: var(--win); font-size: 13.5px; }
.angle { font: 500 17px/1.4 var(--display); margin: 0 0 12px; }
.hooks { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.hooks li { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 8px 10px; background: var(--paper); border-radius: var(--r-sm); }
.link { background: none; border: 0; color: var(--signal); cursor: pointer; padding: 0; font-size: 13px; font-weight: 500; text-decoration: none; }
.ads { display: grid; gap: 12px; }
.ad { display: grid; grid-template-columns: 56px 1fr; gap: 12px; border-radius: var(--r-sm); padding: 6px; margin: -6px; cursor: pointer; }
.ad:hover { background: var(--paper); }
.ad .thumb { width: 56px; height: 56px; }
.ad p { margin: 4px 0 6px; font-size: 13.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ad .meta { font-size: 13px; display: flex; gap: 12px; flex-wrap: wrap; }
.empty { padding: 48px 24px; text-align: center; color: var(--muted); }
.empty h2 { font: 700 20px var(--display); color: var(--ink); margin: 0 0 6px; }
.back { display: none; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 20px; z-index: 50; }
.modal-overlay[hidden] { display: none; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); max-width: 560px; width: 100%; max-height: calc(100vh - 40px); overflow: auto; position: relative; padding: 22px; }
.modal-close { position: absolute; top: 12px; right: 12px; background: var(--soft); border: 0; width: 30px; height: 30px; border-radius: 999px; cursor: pointer; font-size: 15px; color: var(--muted); line-height: 1; }
.modal-close:hover { color: var(--ink); }
.modal-media { width: 100%; height: 200px; max-height: 320px; object-fit: contain; border-radius: var(--r-sm); background: var(--soft); margin-bottom: 16px; display: grid; place-items: center; font: 700 44px var(--display); color: var(--muted); }
.modal-media[src] { display: block; height: auto; }
.modal-text { white-space: pre-wrap; font-size: 14.5px; line-height: 1.5; margin: 14px 0; }
.modal-links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.modal-links .btn { text-decoration: none; display: inline-block; }

@media (max-width: 980px) {
  .shell { padding: 20px 16px 48px; }
  .grid { grid-template-columns: 1fr; }
  .detail { position: static; max-height: none; }
  .grid.has-detail .list, .grid.has-detail .filters-slot { display: none; }
  .grid:not(.has-detail) .detail { display: none; }
  .back { display: inline-block; margin: 16px 22px 0; }
  .head, .row { grid-template-columns: 26px 44px minmax(0, 1fr) 96px; }
  .head .hide-m, .row .hide-m { display: none; }
  .thumb { width: 44px; height: 44px; }
  .signal { width: 88px; }
  .row .name { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .nameline { flex-wrap: wrap; gap: 4px 6px; }
  .nameline .name { flex-basis: 100%; }
  .filters .seg { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; }
  .seg button { white-space: nowrap; }
  .actions { width: 100%; }
  .actions .btn { flex: 1; }
}
@media (prefers-reduced-motion: no-preference) {
  .signal span i, .brow .bar i { transition: width .45s ease; }
}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <h1>Radar</h1>
      <p id="summary">Cargando productos</p>
    </div>
    <div class="actions">
      <button class="btn" id="btn-score" type="button">Recalcular score</button>
      <button class="btn primary" id="btn-pipeline" type="button">Buscar productos</button>
    </div>
  </header>
  <div class="runline" id="runline" aria-live="polite"></div>
  <div id="notice"></div>

  <div class="filters">
    <input class="search" id="q" type="search" placeholder="Buscar por producto o categoría" aria-label="Buscar">
    <div class="seg" role="group" aria-label="Estado" id="status-seg">
      <button type="button" data-status="" aria-pressed="true">Todos</button>
      <button type="button" data-status="candidato" aria-pressed="false">Candidatos</button>
      <button type="button" data-status="en_prueba" aria-pressed="false">En prueba</button>
      <button type="button" data-status="ganador" aria-pressed="false">Ganadores</button>
      <button type="button" data-status="descartado" aria-pressed="false">Descartados</button>
    </div>
    <select id="country" aria-label="País">
      <option value="">Todos los países</option>
      <option value="DO">República Dominicana</option>
      <option value="MX">México</option>
      <option value="CO">Colombia</option>
    </select>
  </div>

  <main class="grid" id="grid">
    <section class="list" aria-label="Ranking de productos">
      <div class="head" role="presentation">
        <span>#</span><span></span><span>Producto</span>
        <span class="r hide-m">Días</span><span class="r hide-m">Tiendas</span><span class="r">Score</span>
      </div>
      <div id="rows"></div>
    </section>
    <aside class="detail" id="detail" aria-label="Detalle del producto">
      <div class="empty"><h2>Elige un producto</h2>Selecciona una fila para ver señales, margen y hooks.</div>
    </aside>
  </main>
</div>

<div class="modal-overlay" id="ad-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="Detalle del anuncio">
    <button class="modal-close" type="button" id="ad-modal-close" aria-label="Cerrar">✕</button>
    <div id="ad-modal-body"></div>
  </div>
</div>

<script>
const STATUS_LABEL = { candidato: "Candidato", en_prueba: "En prueba", ganador: "Ganador", descartado: "Descartado" };
const SIGNALS = [
  { key: "s_longevity", label: "Longevidad", weight: 35 },
  { key: "s_copies", label: "Copias", weight: 25 },
  { key: "s_intensity", label: "Intensidad", weight: 20 },
  { key: "s_viability", label: "Viabilidad", weight: 20 },
];
const JOB_LABEL = { pipeline: "Búsqueda de productos", score: "Recálculo de score", "collect-meta": "Colector Meta",
  "collect-tiktok": "Colector TikTok", normalize: "Normalización", notify: "Alerta" };
const state = { status: "", country: "", q: "", selected: null, products: [], polling: null, currentAds: [] };

const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = (u) => (typeof u === "string" && /^https?:\/\//i.test(u) ? u : "");
const cap = (t) => (t ? t.charAt(0).toUpperCase() + t.slice(1) : "");
const fmt = (n, d = 1) => (n == null ? "" : Number(n).toLocaleString("es-DO", { minimumFractionDigits: d, maximumFractionDigits: d }));

async function api(path, options = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || `Error ${res.status}`);
  }
  return res.json();
}

function thumb(url, name, cls = "thumb") {
  const initial = esc((name || "?").trim().charAt(0).toUpperCase());
  const src = safeUrl(url);
  if (!src) return `<div class="${cls}" aria-hidden="true">${initial}</div>`;
  return `<img class="${cls}" src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer"
    onerror="this.outerHTML='<div class=&quot;${cls}&quot; aria-hidden=&quot;true&quot;>${initial}</div>'">`;
}

function signalBar(p, large = false) {
  const parts = SIGNALS.map((s) => `<span style="flex:${s.weight}"><i style="width:${Math.min(100, (p[s.key] || 0) * 10)}%"></i></span>`).join("");
  return `<div class="signal${large ? " lg" : ""}" aria-hidden="true">${parts}</div>`;
}

function renderRows() {
  const rows = $("rows");
  if (!state.products.length) {
    rows.innerHTML = `<div class="empty"><h2>Sin productos con estos filtros</h2>Cambia los filtros o busca productos nuevos. Para datos de prueba corre <strong>python -m app.cli demo</strong>.</div>`;
    return;
  }
  rows.innerHTML = state.products.map((p, i) => {
    const meta = [cap(p.category), p.countries.join(", ")].filter(Boolean).join(" en ");
    const pills = `${p.status !== "candidato" ? `<span class="pill ${p.status}">${STATUS_LABEL[p.status]}</span>` : ""}${p.is_demo ? ' <span class="pill demo">Demo</span>' : ""}`;
    return `<button class="row" type="button" data-id="${p.id}" aria-selected="${state.selected === p.id}">
      <span class="rank num">${i + 1}</span>
      ${thumb(p.thumbnail, p.name)}
      <span style="min-width:0"><span class="nameline"><span class="name">${esc(p.name)}</span>${pills}</span><span class="sub">${esc(meta)}</span></span>
      <span class="metric num hide-m">${p.days_active}<small>días</small></span>
      <span class="metric num hide-m">${p.advertisers}<small>tiendas</small></span>
      <span class="scorecell"><span class="score num">${fmt(p.score)}</span>${signalBar(p)}</span>
    </button>`;
  }).join("");
}

function renderDetail(p) {
  const grid = $("grid");
  grid.classList.add("has-detail");
  const penalties = [];
  if (p.has_sizes) penalties.push("tiene tallas");
  if (p.fragile) penalties.push("es frágil");
  if ((p.weight || "") === "pesado") penalties.push("es pesado");
  const hints = { s_longevity: `${p.days_active} días activo`, s_copies: `${p.advertisers} tiendas`,
    s_intensity: `${p.ads_count} anuncios`, s_viability: p.margin_ratio ? `margen ${fmt(p.margin_ratio)}x` : "según IA" };

  $("detail").innerHTML = `
    <button class="btn back" type="button" id="back">Volver al ranking</button>
    <div class="dsec">
      <h2 class="dtitle">${esc(p.name)}</h2>
      <div class="sub">${esc([cap(p.category), p.countries.join(", ")].filter(Boolean).join(" en "))}${p.is_demo ? ' <span class="pill demo">Demo</span>' : ""}</div>
      <div class="dscore"><b class="num">${fmt(p.score)}</b><span>de 10</span></div>
      ${signalBar(p, true)}
      <div class="breakdown">
        ${SIGNALS.map((s) => `<div class="brow"><span>${s.label}<small>${esc(hints[s.key])}</small></span>
          <div class="bar"><i style="width:${Math.min(100, (p[s.key] || 0) * 10)}%"></i></div>
          <span class="num" style="text-align:right">${fmt(p[s.key])}</span></div>`).join("")}
      </div>
      ${penalties.length ? `<div class="warn">Score reducido porque ${penalties.join(" y ")}. En contra entrega eso sube devoluciones.</div>` : ""}
      ${p.problem ? `<p class="hint" style="margin:14px 0 0">Resuelve: ${esc(p.problem)}</p>` : ""}
    </div>

    <div class="dsec">
      <h3>Números y decisión</h3>
      <div class="fields">
        <label>Costo proveedor (USD)<input type="number" id="f-cost" min="0" step="0.01" value="${p.supplier_cost_usd ?? ""}"></label>
        <label>Precio de venta (RD$)<input type="number" id="f-price" min="0" step="1" value="${p.sale_price_dop ?? ""}"></label>
      </div>
      <div class="margin" id="margin"></div>
      <div class="seg" role="group" aria-label="Estado del producto" id="f-status">
        ${Object.entries(STATUS_LABEL).map(([k, v]) => `<button type="button" data-status="${k}" aria-pressed="${p.status === k}">${v}</button>`).join("")}
      </div>
      <label style="margin-top:12px">Notas<textarea id="f-notes" placeholder="Resultados de la prueba, proveedor, observaciones">${esc(p.notes ?? "")}</textarea></label>
      <div class="savebar"><button class="btn primary" type="button" id="save">Guardar cambios</button><span id="save-msg" aria-live="polite"></span></div>
    </div>

    ${p.angle || (p.hooks && p.hooks.length) ? `<div class="dsec">
      <h3>Ángulo de venta</h3>
      ${p.angle ? `<p class="angle">${esc(p.angle)}</p>` : ""}
      <ul class="hooks">${(p.hooks || []).map((h) => `<li><span>${esc(h)}</span><button class="link" type="button" data-copy="${esc(h)}">Copiar</button></li>`).join("")}</ul>
    </div>` : ""}

    <div class="dsec">
      <h3>Anuncios detectados (${p.ads.length})</h3>
      <div class="ads">${p.ads.slice(0, 30).map((a) => {
        const days = a.started_at ? Math.max(0, Math.round((new Date(a.last_seen) - new Date(a.started_at)) / 864e5)) : null;
        const links = [safeUrl(a.landing_url) && `<a class="link" href="${esc(a.landing_url)}" target="_blank" rel="noopener noreferrer">Abrir tienda</a>`,
          safeUrl(a.video_url) && `<a class="link" href="${esc(a.video_url)}" target="_blank" rel="noopener noreferrer">Ver video</a>`].filter(Boolean).join("");
        return `<div class="ad" data-ad="${a.id}" tabindex="0" role="button" aria-label="Ver anuncio completo de ${esc(a.advertiser || "anunciante")}">${thumb(a.image_url, a.advertiser)}<div>
          <div class="meta"><strong>${esc(a.advertiser || "Anunciante sin nombre")}</strong><span class="hint">${esc([a.country, a.source, days != null ? `${days} días` : ""].filter(Boolean).join(", "))}</span></div>
          ${a.text ? `<p>${esc(a.text)}</p>` : ""}<div class="meta">${links}</div></div></div>`;
      }).join("")}</div>
    </div>`;

  state.currentAds = p.ads;

  const updateMargin = () => {
    const cost = parseFloat($("f-cost").value), price = parseFloat($("f-price").value);
    const el = $("margin");
    if (!(cost > 0) || !(price > 0)) { el.innerHTML = `<span class="hint">Carga costo y precio para calcular el margen. Tasa usada: RD$${fmt(p.usd_to_dop, 2)} por dólar.</span>`; return; }
    const ratio = price / (cost * p.usd_to_dop);
    const cls = ratio >= 3 ? "good" : ratio < 2 ? "bad" : "";
    const advice = ratio >= 3 ? "Margen sano para pagar publicidad y devoluciones." : ratio < 2 ? "Margen corto: la publicidad se come la ganancia." : "Margen justo: prueba con presupuesto limitado.";
    el.innerHTML = `<b class="num ${cls}">${fmt(ratio)}x</b> <span class="hint">${advice}</span>`;
  };
  $("f-cost").addEventListener("input", updateMargin);
  $("f-price").addEventListener("input", updateMargin);
  updateMargin();

  let chosen = p.status;
  $("f-status").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-status]"); if (!b) return;
    chosen = b.dataset.status;
    $("f-status").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  });
  $("save").addEventListener("click", async () => {
    const btn = $("save"), msg = $("save-msg");
    btn.disabled = true; msg.textContent = ""; msg.className = "";
    const num = (v) => (v === "" ? null : Number(v));
    try {
      const updated = await api(`/api/products/${p.id}`, { method: "PATCH", body: JSON.stringify({
        status: chosen, supplier_cost_usd: num($("f-cost").value), sale_price_dop: num($("f-price").value), notes: $("f-notes").value || null }) });
      await loadProducts(false);
      renderDetail(updated);
      $("save-msg").textContent = "Cambios guardados"; $("save-msg").className = "saved";
    } catch (err) { msg.textContent = `No se guardó: ${err.message}`; msg.style.color = "var(--danger)"; btn.disabled = false; }
  });
  $("detail").querySelectorAll("[data-copy]").forEach((b) => b.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Copiado"; setTimeout(() => (b.textContent = "Copiar"), 1400); }
    catch { b.textContent = "Copia manual"; }
  }));
  $("back").addEventListener("click", () => { grid.classList.remove("has-detail"); state.selected = null; renderRows(); });
}

function openAdModal(ad) {
  const days = ad.started_at ? Math.max(0, Math.round((new Date(ad.last_seen) - new Date(ad.started_at)) / 864e5)) : null;
  const meta = [ad.country, ad.source, days != null ? `${days} días activo` : ""].filter(Boolean).join(" · ");
  const libraryUrl = ad.source === "meta" && ad.external_id
    ? `https://www.facebook.com/ads/library/?id=${encodeURIComponent(ad.external_id)}` : "";
  const links = [
    safeUrl(ad.landing_url) && `<a class="btn" href="${esc(ad.landing_url)}" target="_blank" rel="noopener noreferrer">Abrir tienda</a>`,
    safeUrl(ad.video_url) && `<a class="btn" href="${esc(ad.video_url)}" target="_blank" rel="noopener noreferrer">Ver video</a>`,
    libraryUrl && `<a class="btn" href="${esc(libraryUrl)}" target="_blank" rel="noopener noreferrer">Ver anuncio original</a>`,
  ].filter(Boolean).join("");
  $("ad-modal-body").innerHTML = `
    ${thumb(ad.image_url, ad.advertiser, "modal-media")}
    <h3 style="margin:0 0 4px">${esc(ad.advertiser || "Anunciante sin nombre")}</h3>
    <div class="hint">${esc(meta)}</div>
    ${ad.text ? `<p class="modal-text">${esc(ad.text)}</p>` : ""}
    <div class="modal-links">${links || '<span class="hint">Sin enlaces disponibles</span>'}</div>
  `;
  $("ad-modal").hidden = false;
  $("ad-modal-close").focus();
}
function closeAdModal() { $("ad-modal").hidden = true; }

async function selectProduct(id) {
  state.selected = id; renderRows();
  try { renderDetail(await api(`/api/products/${id}`)); }
  catch (err) { $("detail").innerHTML = `<div class="empty"><h2>No se pudo abrir el producto</h2>${esc(err.message)}</div>`; }
}

async function loadProducts(resetSelection = true) {
  const params = new URLSearchParams();
  if (state.status) params.set("status", state.status);
  if (state.country) params.set("country", state.country);
  if (state.q) params.set("q", state.q);
  try {
    state.products = await api(`/api/products?${params}`);
    if (resetSelection && state.selected && !state.products.some((p) => p.id === state.selected)) state.selected = null;
    renderRows();
  } catch (err) {
    $("rows").innerHTML = `<div class="empty"><h2>La API no respondió</h2>${esc(err.message)}. Verifica que el servidor esté corriendo.</div>`;
  }
  loadStats();
}

async function loadStats() {
  try {
    const s = await api("/api/stats");
    const b = s.by_status;
    $("summary").textContent = `${s.products} productos rastreados, ${b.en_prueba} en prueba y ${b.ganador} ganadores. ${s.pending_normalize} anuncios esperan análisis.`;
  } catch { $("summary").textContent = "Sin conexión con la API"; }
}

async function loadHealth() {
  try {
    const h = await api("/api/health");
    const missing = [!h.apify && "APIFY_TOKEN (colectores)", !h.claude && "ANTHROPIC_API_KEY (análisis con IA)"].filter(Boolean);
    $("notice").innerHTML = missing.length ? `<div class="notice">Falta configurar ${missing.join(" y ")} en el archivo .env. El ranking funciona con los datos que ya existen.</div>` : "";
  } catch {}
}

function timeAgo(iso) {
  if (!iso) return "";
  const mins = Math.round((Date.now() - new Date(iso)) / 60000);
  if (mins < 1) return "hace un momento";
  if (mins < 60) return `hace ${mins} min`;
  const h = Math.round(mins / 60);
  return h < 24 ? `hace ${h} h` : `hace ${Math.round(h / 24)} d`;
}

async function loadRuns() {
  try {
    const runs = await api("/api/runs?limit=5");
    const last = runs[0];
    const running = runs.some((r) => r.status === "running");
    $("btn-pipeline").disabled = running; $("btn-score").disabled = running;
    if (!last) { $("runline").textContent = "Aún no se ha corrido ninguna búsqueda."; return running; }
    const label = JOB_LABEL[last.kind] || last.kind;
    if (last.status === "running") $("runline").textContent = `${label} en curso. Puede tardar varios minutos.`;
    else if (last.status === "error") $("runline").innerHTML = `<span class="err">${esc(label)} falló ${timeAgo(last.finished_at)}: ${esc(last.message)}</span>`;
    else $("runline").textContent = `${label} terminó ${timeAgo(last.finished_at)}. ${last.message || ""}`;
    return running;
  } catch { return false; }
}

async function startJob(kind) {
  try {
    await api(`/api/jobs/${kind}`, { method: "POST" });
    await loadRuns();
    clearInterval(state.polling);
    state.polling = setInterval(async () => {
      if (!(await loadRuns())) { clearInterval(state.polling); loadProducts(false); if (state.selected) selectProduct(state.selected); }
    }, 3000);
  } catch (err) { $("runline").innerHTML = `<span class="err">No se pudo iniciar: ${esc(err.message)}</span>`; }
}

$("rows").addEventListener("click", (e) => { const r = e.target.closest(".row"); if (r) selectProduct(Number(r.dataset.id)); });
$("detail").addEventListener("click", (e) => {
  if (e.target.closest("a")) return;
  const card = e.target.closest(".ad");
  if (!card) return;
  const ad = (state.currentAds || []).find((x) => x.id === Number(card.dataset.ad));
  if (ad) openAdModal(ad);
});
$("detail").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const card = e.target.closest(".ad"); if (!card) return;
  e.preventDefault();
  const ad = (state.currentAds || []).find((x) => x.id === Number(card.dataset.ad));
  if (ad) openAdModal(ad);
});
$("ad-modal-close").addEventListener("click", closeAdModal);
$("ad-modal").addEventListener("click", (e) => { if (e.target.id === "ad-modal") closeAdModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("ad-modal").hidden) closeAdModal(); });
$("status-seg").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  state.status = b.dataset.status;
  $("status-seg").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  loadProducts();
});
$("country").addEventListener("change", (e) => { state.country = e.target.value; loadProducts(); });
let qTimer; $("q").addEventListener("input", (e) => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value.trim(); loadProducts(); }, 250); });
$("btn-pipeline").addEventListener("click", () => startJob("pipeline"));
$("btn-score").addEventListener("click", () => startJob("score"));

loadHealth(); loadProducts(); loadRuns();
</script>
</body>
</html>
